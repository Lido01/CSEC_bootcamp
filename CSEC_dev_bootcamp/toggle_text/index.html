<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Text App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light">

    <!-- Header -->
    <header class="header">
        <h2>Toggle Text Application</h2>
        <button id="themeBtn">Dark / Light</button>
    </header>

    <!-- Main Content -->
    <main class="main-content">

        <section class="toggle-section">
            <h1 id="statusText" class="off">OFF</h1>
            <button id="toggleBtn">Toggle</button>
        </section>

        <section class="info-section">
            <h3>About This Project</h3>
            <p>
                This mini project demonstrates how HTML, CSS, and JavaScript work
                together to create an interactive web page. The text above toggles
                between ON and OFF when the button is clicked or when the Enter key
                is pressed.
            </p>
        </section>

    </main>

    <!-- Sound -->
    <audio id="toggleSound" src="toggle-sound.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
