<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 1️⃣ Header Section -->
  <header class="header">
    <h1>Lidetu Tesfaye</h1>
    <p class="title">Software Engineering Student</p>
  </header>

  <!-- 2️⃣ Profile Section -->
  <section class="profile">
    <img src="/CSEC_dev_bootcamp/assets/lidetu.jpg" alt="Profile Image" />
    <p>
      Hello! I am a passionate software engineering student who loves building
      web applications and learning new technologies.
    </p>
  </section>

  <!-- 3️⃣ Skills Section -->
  <section class="skills">
    <h2>Skills</h2>
    <div class="skills-grid">
      <div class="skill">HTML</div>
      <div class="skill">CSS</div>
      <div class="skill">JavaScript</div>
      <div class="skill">React</div>
    </div>
  </section>

  <!-- 4️⃣ Contact Section -->
  <section class="contact">
    <h2>Contact Me</h2>
    <form>
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <textarea placeholder="Your Message"></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

  <!-- 5️⃣ Footer -->
  <footer>
    <p>© 2025 Lidetu Tesfaye. All rights reserved.</p>
  </footer>

</body>
</html>
